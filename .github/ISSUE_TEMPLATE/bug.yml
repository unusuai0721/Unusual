name: 问题反馈
description: 报告可复现的问题
body:
  - type: input
    id: version
    attributes:
      label: Unusual 版本和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 重现步骤和预期结果
      description: 请使用虚构的账号、群名和消息内容。
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 实际结果与脱敏日志
      description: 提交前请移除密钥、令牌、QQ 号码和聊天记录。
    validations:
      required: true
